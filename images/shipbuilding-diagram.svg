<text x="150" y="84.4" font-family="sans-serif" font-size="18" fill="#e2e8f0"  >Venetian Shipbuilding: Galley Types, Oar Systems, and the Oar-to-Sail Shift</text>
<text x="150" y="119.6" font-family="sans-serif" font-size="12" fill="#718096"  >PANEL 1 — Galley Cross-Section (seen from above, mid-ship cutaway)</text>
<text x="195" y="154.4" font-family="sans-serif" font-size="8" fill="#48bb78"  >Hull (waterline view)</text>
<text x="490.0" y="184.4" font-family="sans-serif" font-size="8" fill="#f6e05e" text-anchor="middle" >Corsia (central gangway)</text>
<text x="235" y="237.6" font-family="sans-serif" font-size="7" fill="#ed8936"  >← Banchi (rowing benches) — port side</text>
<text x="645" y="237.6" font-family="sans-serif" font-size="7" fill="#ed8936"  >starboard side →</text>
<text x="140" y="210.6" font-family="sans-serif" font-size="7" fill="#e53e3e"  >← Oars (remo)</text>
<text x="740" y="210.6" font-family="sans-serif" font-size="7" fill="#e53e3e"  >→</text>
<text x="400" y="266.4" font-family="sans-serif" font-size="8" fill="#48bb78"  >Keel — the backbone of the hull (typically oak)</text>
<text x="150" y="339.6" font-family="sans-serif" font-size="12" fill="#718096"  >PANEL 2 — Galley Type Comparison: Galea Sottile vs Galea Grossa</text>
<text x="200" y="373.0" font-family="sans-serif" font-size="10" fill="#38b2ac"  >Galea Sottile (&quot;Slender Galley&quot; — the classic war galley)</text>
<text x="440" y="378.6" font-family="sans-serif" font-size="7" fill="#38b2ac"  >1 mast (lateen)</text>
<text x="220" y="455.6" font-family="sans-serif" font-size="7" fill="#718096"  >Length: ~38m | Beam: ~4.5m | Oars: 120-150 | Rowers: 3-5 per oar (alla scaloccio) | Crew: ~180 | Speed: 7-8 knots</text>
<text x="200" y="583.0" font-family="sans-serif" font-size="10" fill="#f6e05e"  >Galea Grossa (&quot;Large Galley&quot; — the armed merchant galley)</text>
<text x="350" y="588.6" font-family="sans-serif" font-size="7" fill="#f6e05e"  >2 masts (lateen)</text>
<text x="415.0" y="661.8" font-family="sans-serif" font-size="6" fill="#e2e8f0" text-anchor="middle" >Cargo hold (spices, wool, silk)</text>
<text x="220" y="690.6" font-family="sans-serif" font-size="7" fill="#718096"  >Length: ~42m | Beam: ~6.5m | Oars: 120 | Rowers: 1 per oar (alla sensile) | Crew: ~160 | Cargo: ~140 tons</text>
<text x="150" y="819.6" font-family="sans-serif" font-size="12" fill="#718096"  >PANEL 3 — Oar-to-Sail Evolution (Venetian Shipbuilding, 13th-16th c.)</text>
<text x="240" y="868.0" font-family="sans-serif" font-size="10" fill="#38b2ac"  >Galea Sottile</text>
<text x="230" y="883.6" font-family="sans-serif" font-size="7" fill="#4a5568"  >(13th c.)</text>
<text x="410" y="868.0" font-family="sans-serif" font-size="10" fill="#f6e05e"  >Galea Grossa</text>
<text x="405" y="883.6" font-family="sans-serif" font-size="7" fill="#4a5568"  >(14th-15th c.)</text>
<text x="610" y="868.0" font-family="sans-serif" font-size="10" fill="#e53e3e"  >Carrack / Round Ship (Nave)</text>
<text x="620" y="883.6" font-family="sans-serif" font-size="7" fill="#4a5568"  >(mid-15th c. onward)</text>
<text x="820" y="868.0" font-family="sans-serif" font-size="10" fill="#9f7aea"  >Galleass</text>
<text x="815" y="883.6" font-family="sans-serif" font-size="7" fill="#4a5568"  >(late 16th c.)</text>
<text x="245" y="912.8" font-family="sans-serif" font-size="6" fill="#718096"  >↑ Oars primary</text>
<text x="430" y="912.8" font-family="sans-serif" font-size="6" fill="#718096"  >↑ Oars + sails balanced</text>
<text x="620" y="912.8" font-family="sans-serif" font-size="6" fill="#718096"  >↑ Sails primary (grain, bulk goods)</text>
<text x="830" y="912.8" font-family="sans-serif" font-size="6" fill="#718096"  >↑ Sail + heavy cannon</text>
<text x="150" y="976.4" font-family="sans-serif" font-size="8" fill="#a0aec0"  >Key: The Arsenal standardized components — the 'Arsenal system' meant galleys could be produced in 30 days. Galileo himself worked on galley proportions in the 1590s.</text>
</svg>